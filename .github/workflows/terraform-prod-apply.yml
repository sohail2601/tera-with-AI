name: Terraform Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  production-plan:
    name: Create Production Plan
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_environment: prod
      TF_VAR_my_ip: ${{ vars.MY_IP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify configuration
        run: |
          terraform version
          aws sts get-caller-identity
          test -n "$TF_VAR_aws_region"
          test -n "$TF_VAR_project_name"
          test -n "$TF_VAR_my_ip"

      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config=backend-prod.hcl

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Create Production Plan
        run: |
          terraform plan -input=false -out=tfplan

      - name: Display Production Plan
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: production-tfplan
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  production-apply:
    name: Apply Approved Production Plan
    needs: production-plan
    runs-on: [self-hosted, linux, x64]

    environment:
      name: production

    env:
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config=backend-prod.hcl

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: production-tfplan

      - name: Apply Approved Plan
        run: terraform apply -input=false tfplan
